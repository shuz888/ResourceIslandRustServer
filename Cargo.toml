[package]
name = "resource-island-server"
version = "0.1.1"
edition = "2024"

[dependencies]
axum = { version = "0.8.8", features = ["http2", "ws", "tokio", "tower-log", "json"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
tokio = { version = "1.49.0", features = ["full"] }
anyhow = "1.0.101"
serde = { version = "1.0.228", features = ["derive"] }
yaml_serde = "0.10.3"
serde_json = "1.0.149"
futures = "0.3.31"
rand_chacha = "0.10.0"
rand_seeder = "0.5.0"
uuid = { version = "1.20.0", features = [ "serde", "v4"] }
rand = "0.10.0"
